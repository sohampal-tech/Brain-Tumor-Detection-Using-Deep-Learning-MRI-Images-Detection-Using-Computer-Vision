<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Brain Tumor Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2f7 0%, #d9e4f5 100%);
            min-height: 100vh;
        }
        .main-container {
            max-width: 680px;
            margin: 50px auto;
            padding: 0 15px;
        }
        .card {
            border-radius: 16px;
            border: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .header-box {
            background: #0d6efd;
            color: white;
            border-radius: 16px;
            padding: 28px 20px;
            margin-bottom: 24px;
            box-shadow: 0 6px 18px rgba(13, 110, 253, 0.25);
        }
        .btn-detect {
            width: 100%;
            padding: 12px;
            font-weight: 600;
            font-size: 1.05rem;
            border-radius: 10px;
        }
        .mri-preview {
            max-height: 320px;
            width: auto;
            object-fit: contain;
            border-radius: 12px;
            border: 3px solid #e9ecef;
            margin-top: 15px;
        }
        .result-badge {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .badge-safe { background-color: #d1e7dd; color: #0f5132; }
        .badge-danger { background-color: #f8d7da; color: #842029; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header-box text-center">
            <h1 class="h3 fw-bold mb-2">🧠 MRI Brain Tumor Detection System</h1>
            <p class="mb-0 opacity-75">Upload a brain MRI scan to detect tumors and classify their type (Glioma, Meningioma, Pituitary, or No Tumor)</p>
        </div>

        <div class="card p-4 mb-4">
            <form id="upload-form">
                <div class="mb-3">
                    <label for="file" class="form-label fw-semibold text-secondary">Select Brain MRI Image (.jpg, .jpeg, .png):</label>
                    <input type="file" class="form-control form-control-lg" id="file" name="file" accept="image/*" required>
                </div>

                <div id="preview-container" class="text-center mb-3" style="display: none;">
                    <p class="small text-muted mb-1">Selected MRI Scan:</p>
                    <img id="preview-img" class="mri-preview" alt="Selected MRI Preview">
                </div>

                <!-- type="button" so the browser never submits/reloads the page -->
                <button type="button" id="submit-btn" class="btn btn-primary btn-detect">Upload and Detect Tumor</button>
            </form>
        </div>

        <div id="results" class="card p-4 text-center" style="display: none;">
            <h5 class="text-uppercase text-muted fw-bold small mb-3">Diagnostic Prediction Result</h5>
            <div>
                <span id="result-badge" class="result-badge"></span>
            </div>
            <p class="fs-5 text-secondary mb-0">
                Model Confidence: <strong id="confidence-text" class="text-dark"></strong>
            </p>
            <p class="small text-muted mt-3 mb-0">This is an AI prediction for learning purposes, not a medical diagnosis.</p>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file');
        const btn = document.getElementById('submit-btn');

        // Show preview when a file is chosen
        fileInput.addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById('preview-img').src = e.target.result;
                document.getElementById('preview-container').style.display = 'block';
                document.getElementById('results').style.display = 'none';
            };
            reader.readAsDataURL(file);
        });

        // Send image to Flask and show result
        btn.addEventListener('click', async function () {
            if (!fileInput.files[0]) {
                alert('Please choose an MRI image first.');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Analyzing MRI Scan...';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                // Relative URL: works when the page is opened at http://127.0.0.1:5000/
                const response = await fetch('http://127.0.0.1:5000/predict', { method: 'POST', body: formData });
                const data = await response.json();
                console.log('Server response:', data);

                if (!response.ok || data.error) {
                    alert('Backend Error: ' + (data.error || response.statusText));
                    return;
                }

                const badge = document.getElementById('result-badge');
                if (data.result === 'No Tumor') {
                    badge.className = 'result-badge badge-safe';
                    badge.innerText = '✅ ' + data.result;
                } else {
                    badge.className = 'result-badge badge-danger';
                    badge.innerText = '⚠️ ' + data.result;
                }

                document.getElementById('confidence-text').innerText = data.confidence;
                document.getElementById('results').style.display = 'block';
                document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
            } catch (err) {
                console.error(err);
                alert('Request failed: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Upload and Detect Tumor';
            }
        });
    </script>
</body>
</html>
